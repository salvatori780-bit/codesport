<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Beige background matching portfolio theme -->
  <rect width="1200" height="1600" fill="#e8e3d8"/>
  
  <!-- Subtle texture pattern -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
  </filter>
  <rect width="1200" height="1600" filter="url(#noise)" opacity="0.15"/>
  
  <!-- Center icon -->
  <g transform="translate(600, 800)">
    <!-- Camera icon -->
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="none" stroke="#8b7355" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#8b7355" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#8b7355" stroke-width="2"/>
    <rect x="20" y="-35" width="20" height="10" rx="2" fill="#8b7355"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="920" font-family="sans-serif" font-size="18" fill="#8b7355" text-anchor="middle">
    Replace with your image
  </text>
</svg>
